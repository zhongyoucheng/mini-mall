server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/mini_mall_order?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:zyC191380!!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated  # 生产者异步确认
    publisher-returns: true             # 开启路由失败回调
    template:
      mandatory: true                   # 路由失败时触发 Return 回调
    listener:
      simple:
        acknowledge-mode: manual    # 手动 ACK（默认 auto）
        prefetch: 1                 # 每次只取 1 条，限流保护 DB
        retry:
          enabled: true
          max-attempts: 3           # 最多重试 3 次
          initial-interval: 1000    # 首次重试间隔 1s
          multiplier: 2.0           # 间隔倍增（1s → 2s → 4s）
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.minimall.order.model
  configuration:
    map-underscore-to-camel-case: true

feign:
  sentinel:
    enabled: true
