server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/mini_mall_order?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:zyC191380!!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: guest
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.minimall.order.model
  configuration:
    map-underscore-to-camel-case: true

feign:
  sentinel:
    enabled: true
